<style>

  .qr img { display: block; width: 4.2in; height: 4.2in; }
  p { margin: 0; font-size: 20px; font-weight: 500; line-height: 1.4; }
  .who { font-size: 16px; opacity: .8; }
  .url { font-size: 13px; opacity: .6; word-break: break-all; }
